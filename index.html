
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>TEE IN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #101010;
      --green: #22c55e;
      --muted: #a3a3a3;
      --line: #383838;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: var(--bg);
      color: white;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 620px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--green);
      font-size: clamp(4rem, 17vw, 8.5rem);
      line-height: .92;
      letter-spacing: -.075em;
      font-weight: 700;
    }

    .subtitle {
      margin: 26px 0 30px;
      font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 750;
      text-transform: uppercase;
    }

    .counter {
      margin: 0;
      font-size: clamp(2.4rem, 9vw, 4.4rem);
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .counter-label {
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: bold;
      letter-spacing: .18em;
    }

    .progress {
      height: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--line);
      margin-bottom: 30px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      transition: width .35s ease;
    }

    form {
      display: grid;
      gap: 12px;
      text-align: left;
    }

    label {
      color: var(--muted);
      font-size: .9rem;
    }

    input {
      width: 100%;
      min-height: 58px;
      padding: 0 17px;
      border: 1px solid #555;
      border-radius: 10px;
      background: #181818;
      color: white;
      font-size: 1rem;
    }

    input:focus {
      outline: 2px solid var(--green);
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #07130b;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .65;
    }

    .privacy, .status {
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.5;
      text-align: center;
    }

    .privacy { margin-top: 18px; }
    .status { min-height: 1.3em; }

    .hidden { display: none; }
  </style>
</head>

<body>
<main>

  <h1>TEE IN</h1>

  <p class="subtitle">SKRIV UNDER FÖR VÅR BRODER</p>

  <section>
    <p class="counter">
      <span id="count">0</span> / 1 000
    </p>

    <p class="counter-label">UNDERSKRIFTER</p>

    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
  </section>

  <form id="signature-form">

    <label for="signer-name">
      Ditt namn eller smeknamn
    </label>

    <input
      id="signer-name"
      type="text"
      maxlength="40"
      placeholder="Skriv ditt namn här"
      autocomplete="nickname"
      required
    >

    <button id="submit-button" type="submit">
      SKRIV UNDER
    </button>

  </form>

  <p class="privacy">
    Alla underskrifter är privata.
    Endast det totala antalet visas.
  </p>

  <p class="status" id="status" role="status"></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // SUPABASE INSTÄLLNINGAR

  const SUPABASE_URL = "https://puquxestvywtpsfjaykt.supabase.co";

  const SUPABASE_ANON_KEY = "sb_publishable_C11GMBziDGuOCBp9gGBM3A_yr9_8cxw";

  const TARGET = 1000;

  // SKAPA DATABASKOPPLING

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  // ELEMENT

  const countEl = document.getElementById("count");
  const progressEl = document.getElementById("progress");
  const form = document.getElementById("signature-form");
  const nameInput = document.getElementById("signer-name");
  const button = document.getElementById("submit-button");
  const statusEl = document.getElementById("status");

  const SIGNED_KEY = "tee-in-already-signed-v2";

  function checkPreviousSignature() {
    if (localStorage.getItem(SIGNED_KEY) === "yes") {
      nameInput.disabled = true;
      button.disabled = true;
      button.textContent = "DU HAR REDAN SKRIVIT UNDER";
      statusEl.textContent = "Tack för ditt stöd!";
    }
  }

  // UPPDATERA RÄKNAREN

  function renderCount(count) {
    const safeCount = Math.max(0, Number(count) || 0);

    countEl.textContent =
      safeCount.toLocaleString("sv-SE");

    progressEl.style.width =
      Math.min(100, (safeCount / TARGET) * 100) + "%";
  }

  async function refreshCount() {
    const { data, error } = await db.rpc(
      "get_signature_count"
    );

    if (error) {
      console.error(error);
      statusEl.textContent =
        "Kunde inte hämta underskrifterna just nu.";
      return;
    }

    renderCount(data);
  }

  // SKRIV UNDER

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    // Kontrollera om besökaren redan har skrivit under.

    if (localStorage.getItem(SIGNED_KEY) === "yes") {
      checkPreviousSignature();
      return;
    }

    const name = nameInput.value
      .trim()
      .replace(/\s+/g, " ");

    if (!name || name.length > 40) {
      statusEl.textContent =
        "Skriv ett namn eller smeknamn.";
      return;
    }

    button.disabled = true;
    button.textContent = "SKICKAR...";
    statusEl.textContent = "";

    // Spara underskriften i Supabase.

    const { error } = await db
      .from("signatures")
      .insert({
        display_name: name
      });

    if (error) {
      console.error(error);

      statusEl.textContent =
        "Underskriften kunde inte sparas. Försök igen.";

      button.disabled = false;
      button.textContent = "SKRIV UNDER";

      return;
    }

    // Markera att denna webbläsare har skrivit under.

    localStorage.setItem(SIGNED_KEY, "yes");

    nameInput.value = "";

    checkPreviousSignature();

    statusEl.textContent =
      "Tack! Din underskrift är registrerad.";

    // Hämta det nya antalet.

    await refreshCount();
  });

  // STARTA SIDAN

  checkPreviousSignature();
  refreshCount();

  // Uppdatera räknaren var 15:e sekund.

  setInterval(refreshCount, 15000);

</script>

</body>
</html>
